apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-pulse
  template:
    metadata:
      labels:
        app: store-pulse
    spec:
      containers:
        - name: store-pulse
          image: store-pulse:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: store-pulse-config
            - secretRef:
                name: store-pulse-secrets
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20